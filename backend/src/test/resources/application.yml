server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:plant_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
    defer-datasource-initialization: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
